{% extends 'hi/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Вход в аккаунт</h2>

    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Войти</button>
    </form>

    <p class="auth-footer">
        Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
    </p>

    <p class="auth-footer" style="margin-top: 8px;">
    <a href="{% url 'password_reset' %}">Забыли пароль?</a>
</p>

    <hr>

    <p class="auth-footer" style="font-size: 13px;">
        Вы администратор? <a href="{% url 'staff-login' %}">Войти здесь</a>
    </p>
</div>
{% endblock %}
