{% load static i18n %}{% get_current_language as language_code %}
<!DOCTYPE html><html lang="{{ language_code|slice:':2' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ code }} — МойСайт</title><link rel="stylesheet" href="{% static 'hi/style.css' %}?v=20"></head><body class="error-page"><main><a class="logo" href="{% url 'home' %}">МойСайт<span class="heading-dot">.</span></a><p class="error-code">{{ code }}</p><h1>{{ title }}</h1><p>{{ description }}</p><div><a class="btn-primary" href="{% url 'home' %}">{% translate 'К коллекции' %} →</a><a class="btn-secondary" href="{% url 'login' %}">{% translate 'Войти' %}</a></div></main></body></html>
