{% extends 'hi/base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Восстановление пароля</h2>
    <p style="margin-bottom: 20px; text-align: center; color: var(--text-muted); font-size: 14px;">
        Введите email, указанный при регистрации. Мы отправим ссылку для сброса.
    </p>

    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Отправить ссылку</button>
    </form>

    <p class="auth-footer">
        <a href="{% url 'login' %}">Вернуться ко входу</a>
    </p>
</div>
{% endblock %}
