{% load i18n %}<div class="gallery-admin-models">{% for model in models %}<div class="gallery-admin-model" data-admin-model="{{ model.key }}">{% if model.admin_url %}<a class="gallery-admin-model-name" href="{{ model.admin_url }}">{{ model.name }}</a>{% else %}<span class="gallery-admin-model-name">{{ model.name }}</span>{% endif %}{% if model.add_url %}<a class="gallery-admin-add" href="{{ model.add_url }}" aria-label="{% translate 'Добавить' %}: {{ model.name }}">{% translate 'Добавить' %}<span aria-hidden="true">+</span></a>{% elif model.admin_url %}<span class="gallery-admin-row-arrow" aria-hidden="true">↗</span>{% endif %}</div>{% endfor %}</div>
